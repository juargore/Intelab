apply from: "dependencies.gradle"

buildscript {
    ext {
        core_ktx_version        = "1.7.0"
        appcompat_version       = "1.4.1"
        material_version        = "1.5.0"
        constraint_version      = "2.1.3"
        navigation_version      = "2.4.2"
        lifecycle_version       = "2.4.1"
        hilt_navigation_version = "1.0.0"
        hilt_version            = "2.42"
        hilt_compiler_version   = "2.42"
        legacy_version          = "1.0.0"
        kotlin_gradle_version   = "1.6.21"
        gradle_version          = "7.1.3"
        retrofit_version        = "2.9.0"
        okhttp3_version         = "4.9.1"
        junit_version           = "4.13.2"
        junit_ext_version       = "1.1.3"
        espresso_version        = "3.4.0"
        room_version            = "2.4.2"
        glide_version           = "4.13.0"
        java_version            = 1.8
        camerax_version         = "1.1.0"
        flexbox_version         = "3.0.0"
        google_services         = "4.3.13"
        compressor              = "3.0.1"
        viewPagerVersion        = "1.0.0"
    }
    repositories {
        google()
        mavenCentral()
        maven {url 'https://developer.huawei.com/repo/'}
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.10'
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigation_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "com.google.gms:google-services:$google_services"
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.1'
        classpath 'com.huawei.agconnect:agcp:1.6.5.300'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Configure the Maven repository address for the HMS Core SDK.
        maven {url 'https://developer.huawei.com/repo/'}
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

tasks.whenTaskAdded { task ->
    if (task.name == 'compileDebugSources' || task.name == 'compileReleaseSources') {
        task.dependsOn lint
        task.mustRunAfter lint
    }
}